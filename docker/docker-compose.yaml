# Standalone multi-robot simulation (no TwinSight robot_adapter).
# Portable base: no GPU access. Add ONE host override for graphics:
#   Linux + NVIDIA:        -f docker-compose.nvidia.yaml
#   Linux + Intel/AMD GPU: -f docker-compose.dri.yaml
#   macOS (XQuartz):       -f docker-compose.macos.yaml
# e.g.  cd docker && docker compose -f docker-compose.yaml -f docker-compose.nvidia.yaml up --build
# To also run the TwinSight robot_adapter, add docker-compose.robot-adapter.yaml.
services:
  tb3-world:
    build:
      # Context is this repository's root; the image builds from it alone.
      context: ..
      dockerfile: docker/Dockerfile
    image: tb3_multi_robot:latest
    container_name: tb3-world
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_world.launch.py

  tb3-nav2:
    image: tb3_multi_robot:latest
    container_name: tb3-nav2
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    depends_on:
      tb3-world:
        condition: service_started
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_nav2.launch.py

networks:
  ros2_net:
    driver: bridge
