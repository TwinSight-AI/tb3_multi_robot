services:
  tb3-world:
    build:
      # Context is the workspace src/ dir so the Dockerfile can also COPY the
      # sibling robot_adapter package and build it alongside tb3_multi_robot.
      context: ../../
      dockerfile: tb3_multi_robot/docker/Dockerfile
    image: tb3_multi_robot:latest
    container_name: tb3-world
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    gpus: all
    extra_hosts:
      # Lets TWINSIGHT_API_BASE_URL reach a backend published on the host
      # (e.g. a sibling docker-compose stack's container) via its host port,
      # since "localhost" inside this container is this container itself.
      - "host.docker.internal:host-gateway"
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # TwinSight backend URL, shared by every robot's adapter. Use
      # http://host.docker.internal:<port> to reach a backend published on
      # the host (see extra_hosts above).
      - TWINSIGHT_API_BASE_URL=${TWINSIGHT_API_BASE_URL:-http://localhost:8001}
      # Per-robot TwinSight platform credentials (UUID + secret), read by
      # tb3_world.launch.py for each robot's adapter node. Set these in a
      # docker/.env file or the shell environment before `docker compose up`;
      # any left unset fall back to the adapter's built-in dummy UUID.
      - TB1_ROBOT_ID=${TB1_ROBOT_ID:-}
      - TB1_ROBOT_SECRET=${TB1_ROBOT_SECRET:-}
      - TB2_ROBOT_ID=${TB2_ROBOT_ID:-}
      - TB2_ROBOT_SECRET=${TB2_ROBOT_SECRET:-}
      - TB3_ROBOT_ID=${TB3_ROBOT_ID:-}
      - TB3_ROBOT_SECRET=${TB3_ROBOT_SECRET:-}
      - TB4_ROBOT_ID=${TB4_ROBOT_ID:-}
      - TB4_ROBOT_SECRET=${TB4_ROBOT_SECRET:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_world.launch.py

  tb3-nav2:
    image: tb3_multi_robot:latest
    container_name: tb3-nav2
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    depends_on:
      tb3-world:
        condition: service_started
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_nav2.launch.py

networks:
  ros2_net:
    driver: bridge
