services:
  tb3-world:
    build:
      # Context is the workspace src/ dir so the Dockerfile can also COPY the
      # sibling robot_adapter package and build it alongside tb3_multi_robot.
      context: ../../
      dockerfile: tb3_multi_robot/docker/Dockerfile
    image: tb3_multi_robot:latest
    container_name: tb3-world
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    gpus: all
    extra_hosts:
      # Lets TWINSIGHT_API_BASE_URL reach a backend published on the host
      # (e.g. a sibling docker-compose stack's container) via its host port,
      # since "localhost" inside this container is this container itself.
      - "host.docker.internal:host-gateway"
    env_file:
      # Per-robot TwinSight platform credentials (UUID + secret) and the
      # backend URL, read by tb3_world.launch.py for each robot's adapter
      # node. Loaded explicitly so it applies regardless of the directory
      # `docker compose` is invoked from; any var left unset here falls back
      # to the adapter's built-in dummy UUID.
      - .env
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_world.launch.py

  tb3-nav2:
    image: tb3_multi_robot:latest
    container_name: tb3-nav2
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    depends_on:
      tb3-world:
        condition: service_started
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ../:/robot_ws
    networks:
      - ros2_net
    command: ros2 launch tb3_multi_robot tb3_nav2.launch.py

networks:
  ros2_net:
    driver: bridge
